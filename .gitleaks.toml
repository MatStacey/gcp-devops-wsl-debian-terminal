[allowlist]
description = "Ignore template placeholders and sample configuration keys"
regexes = [
  '''YOUR_GEMINI_API_KEY''',
  '''YOUR_CLAUDE_API_KEY''',
  '''YOUR_SYNC_REPO_URL''',
  '''ollama'''
]
paths = [
  '''lib/templates/config\.yaml\.tpl''',
  '''lib/templates/gitignore\.tpl''',
  '''README\.md'''
]
