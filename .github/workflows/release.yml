name: Automated Semantic Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt yamllint jq

      - name: Run ShellCheck
        run: |
          echo "🔍 Running ShellCheck..."
          find .bash.d -type f -name "*.sh" -print0 | xargs -0 shellcheck -e SC1090,SC1091,SC2119,SC2120,SC2207,SC2015,SC2317,SC2016,SC2129,SC2028,SC1003
          shellcheck -e SC1090,SC1091,SC2119,SC2120,SC2207,SC2015,SC2317,SC2016,SC2129,SC2028,SC1003 install.sh .bashrc

      - name: Verify Formatting (shfmt)
        run: |
          echo "🎨 Verifying Google Shell Style..."
          shfmt -d -i 2 -ci -sr .

      - name: Run Ruff Python Linter
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check ."

      - name: Verify Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Validate JSON and YAML Syntax
        run: |
          echo "🔍 Validating JSON files..."
          find . -name "*.json" -not -path "./.devcontainer/*" -print0 | xargs -0 -I {} jq empty {}

          echo "🔍 Validating YAML files..."
          find . \( -name "*.yaml" -o -name "*.yml" \) -not -path "*/lib/blueprints/*" -print0 | xargs -0 yamllint -d "{extends: relaxed, rules: {line-length: disable}}"

  build-and-release:
    name: Build and Release
    needs: [lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate SemVer and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Package Repository Zip
        run: |
          ZIP_NAME="mt-devops-framework-${{ steps.tag_version.outputs.new_tag }}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          zip -r "$ZIP_NAME" . -x ".git/*" -x ".git" -x ".github/*" -x "venv/*" -x "*/__pycache__/*" -x ".terraform/*" -x "*.tfstate*"

      - name: Smoke-Test Packaged Release Install
        run: |
          echo "🧪 Verifying the packaged release installs cleanly and matches the source tree..."
          EXTRACT_DIR=$(mktemp -d)
          TEST_HOME=$(mktemp -d)
          unzip -q "$ZIP_NAME" -d "$EXTRACT_DIR"

          # Decline the interactive bootstrap prompt -- this test verifies the
          # file sync, not system package installation.
          echo n | HOME="$TEST_HOME" bash "$EXTRACT_DIR/install.sh"

          echo "🔍 Diffing installed .bash.d against the source tree..."
          if ! diff -rq .bash.d "$TEST_HOME/.bash.d" \
            --exclude=data --exclude=config.yaml \
            --exclude=.env.cache --exclude="*_token.sh" \
            --exclude=".syncignore" --exclude=".current_version"; then
            echo "::error::Installed .bash.d tree does not match the source tree -- the release package is missing files that should have shipped."
            exit 1
          fi

          echo "✅ Smoke-test passed: packaged release installs and matches source."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ## 🚀 What's Changed in ${{ steps.tag_version.outputs.new_tag }}

            ${{ steps.tag_version.outputs.changelog }}

            ---
            ### 📦 Installation & Updating
            To update or install this release directly from your terminal, run:
            ```bash
            mt-get-update -v ${{ steps.tag_version.outputs.new_tag }}
            ```
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
