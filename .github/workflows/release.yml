name: Automated Semantic Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e5f9ef6a5a3a7894a82196659fef06df0e21a221 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt yamllint jq

      - name: Run ShellCheck
        run: |
          echo "🔍 Running ShellCheck..."
          find .bash.d -type f -name "*.sh" -print0 | xargs -0 shellcheck -e SC1090,SC1091,SC2119,SC2120,SC2207,SC2015,SC2317,SC2016,SC2129,SC2028,SC1003
          shellcheck -e SC1090,SC1091,SC2119,SC2120,SC2207,SC2015,SC2317,SC2016,SC2129,SC2028,SC1003 install.sh .bashrc

      - name: Verify Formatting (shfmt)
        run: |
          echo "🎨 Verifying Google Shell Style..."
          shfmt -d -i 2 -ci -sr .

      - name: Run Ruff Python Linter
        uses: astral-sh/ruff-action@b7351fc86a54fae89cfec9ec6302e1fe851eb33c # v3.1.0
        with:
          args: "check ."

      - name: Verify Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@54c9daabfe82e31417d0283e6177c46d836e5766 # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Validate JSON and YAML Syntax
        run: |
          echo "🔍 Validating JSON files..."
          find . -name "*.json" -not -path "./.devcontainer/*" -print0 | xargs -0 -I {} jq empty {}

          echo "🔍 Validating YAML files..."
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

  build-and-release:
    name: Build and Release
    needs: [lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Calculate SemVer and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a873ed74d126d83cfcfd4da0666358b27072a39d # v6.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Package Repository Zip
        run: |
          ZIP_NAME="mt-devops-framework-${{ steps.tag_version.outputs.new_tag }}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          zip -r "$ZIP_NAME" . -x "*.git*" -x ".github/*" -x "venv/*" -x "*/__pycache__/*" -x ".terraform/*" -x "*.tfstate*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fecc48a4ad6e8894afc79c934720a4034aa5b # v2.2.0
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ## 🚀 What's Changed in ${{ steps.tag_version.outputs.new_tag }}

            ${{ steps.tag_version.outputs.changelog }}

            ---
            ### 📦 Installation & Updating
            To update or install this release directly from your terminal, run:
            ```bash
            mt-get-update -v ${{ steps.tag_version.outputs.new_tag }}
            ```
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
